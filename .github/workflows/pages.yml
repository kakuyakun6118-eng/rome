name: Deploy to GitHub Pages

# 手元に開発環境がなくても iPhone から遊べるように、
# ビルドした静的ファイルを GitHub Pages へ載せる。
# リポジトリの Settings → Pages → Source を "GitHub Actions" にしておくこと
#
# **GitHub Pages は1リポジトリに1サイトしか持てない。** このリポジトリには
# 別のプロジェクトも同居していて、最後にデプロイしたものが前のものを
# 上書きしてしまう。このアプリ専用の URL が要るなら、専用のリポジトリ
# （例: rome）へ移すこと。移した先では既定ブランチが main になるので、
# どちらの名前でも動くよう両方を引き金にしてある
on:
  push:
    branches:
      - main
      - claude/western-rome-sim-phase-0-73l154
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。進行中の公開は中断しない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
