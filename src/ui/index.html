<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2213%22>🦅</text></svg>" />
    <title>西ローマ帝国末期シミュレーション</title>
    <!--
      ホーム画面に追加したときの名前を固定する。
      これが無いと <title> やそのときの状況から名が決まり、
      アイコンの名前が意図しないものになることがある
    -->
    <meta name="apple-mobile-web-app-title" content="西ローマ帝国" />
    <meta name="application-name" content="西ローマ帝国" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#e9dec4" />
    <meta name="description" content="395年から476年まで、西ローマ帝国を実権者の立場で運営するターン制シミュレーション" />
  </head>
  <body>
    <!--
      読み込みに失敗したときの受け皿。React が立ち上がれば中身ごと置き換わる。
      白い画面のまま黙って終わると、どのページを開いているのかすら
      分からなくなるので、名前と正しい URL をここに出しておく
    -->
    <div id="root">
      <div
        style="
          font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
          padding: 2rem 1.5rem;
          color: #2a2118;
          line-height: 1.9;
        "
      >
        <h1 style="font-size: 1.1rem; letter-spacing: 0.18em; color: #3d1329">
          西ローマ帝国末期シミュレーション
        </h1>
        <p style="font-size: 0.85rem; color: #5d4c37">
          読み込んでいます。この表示のまま変わらないときは、ページを再読み込みしてください。
        </p>
        <noscript>
          <p style="font-size: 0.85rem; color: #8b2331">
            JavaScript が無効になっています。有効にすると遊べます。
          </p>
        </noscript>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
